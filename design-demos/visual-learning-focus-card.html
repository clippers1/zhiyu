<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>方向 C · 单步聚焦</title>
  <style>
    @font-face{font-family:ZhiyuSans;src:url('./assets/noto-sans-sc.woff2')}@font-face{font-family:ZhiyuSerif;src:url('./assets/noto-serif-sc.woff2');font-weight:700}
    /* Assumption: one relation per screen minimizes cognitive load and works best on phones. */
    *{box-sizing:border-box}body{margin:0;background:#e8ede5;color:#243e34;font-family:ZhiyuSans,sans-serif}button{font-family:ZhiyuSans,sans-serif}.phone{width:390px;min-height:844px;margin:auto;background:#f8faf5;padding:28px 20px}.eyebrow{font-size:12px;letter-spacing:.12em;color:#738371}.title{margin:7px 0 8px;font:700 30px/1.15 ZhiyuSerif,serif}.intro{margin:0;color:#55685e;font-size:14px;line-height:1.65}.stage{margin-top:28px;padding:24px 18px 20px;background:#fff;border:1px solid #d8e1d5}.progress{display:flex;gap:5px}.progress i{height:3px;flex:1;background:#dce3d9}.progress i:first-child{background:#315d43}.counter{display:flex;justify-content:space-between;margin-top:15px;color:#7a897b;font-size:11px}.relation{display:grid;grid-template-columns:1fr 64px 1fr;align-items:center;height:220px}.place{text-align:center}.disc{display:grid;place-items:center;width:94px;height:94px;margin:auto;border-radius:50%;background:#e2edf2;color:#416b82;font:700 17px ZhiyuSerif,serif;box-shadow:inset 0 0 0 1px #bdd0da}.place.to .disc{background:#e7eee2;color:#466847;box-shadow:inset 0 0 0 1px #c4d4bd}.place small{display:block;margin-top:10px;color:#849185}.arrow{text-align:center;color:#6f8777;font-size:32px}.arrow small{display:block;font-size:10px;letter-spacing:.08em}.stage h2{margin:0;font:700 22px/1.3 ZhiyuSerif,serif}.stage p{margin:8px 0 0;color:#566a60;font-size:14px;line-height:1.7}.controls{display:grid;grid-template-columns:48px 1fr 48px;gap:8px;margin-top:12px}.controls button{min-height:46px;border:1px solid #cbd7c8;background:#fff;color:#315143;font-size:16px}.controls .play{background:#315d43;color:#fff;border-color:#315d43;font-size:14px}.chapters{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;margin-top:22px;background:#d9e1d7;border:1px solid #d9e1d7}.chapters button{min-height:54px;border:0;background:#f8faf5;color:#65776c;font-size:11px}.chapters button.active{background:#e6ede2;color:#29493b;font-weight:700}.note{margin-top:16px;color:#7b897c;font-size:11px;line-height:1.6}
  </style>
</head><body><main class="phone">
  <div class="eyebrow">方向 C · 单步聚焦</div><h1 class="title">每次只看一个关系</h1><p class="intro">不把整张循环一次塞给用户。当前只展示“从哪里到哪里”，其余步骤作为轻量目录。</p>
  <section class="stage"><div class="progress"><i></i><i></i><i></i><i></i><i></i><i></i></div><div class="counter"><span>第 1 步</span><span>共 6 步</span></div>
    <div class="relation"><div class="place"><div class="disc">全身</div><small>起点</small></div><div class="arrow">→<small>血液返回</small></div><div class="place to"><div class="disc">右心房</div><small>到达</small></div></div>
    <h2>从全身回到右心房</h2><p>来自全身的血液经上、下腔静脉进入右心房。</p>
  </section>
  <div class="controls"><button>‹</button><button class="play">逐步播放</button><button>›</button></div>
  <div class="chapters"><button class="active">01 全身</button><button>02 右心房</button><button>03 右心室</button><button>04 肺</button><button>05 左心房</button><button>06 左心室</button></div>
  <p class="note">适合手机阅读；完整循环仍可在“展开全部过程”里一次读完。</p>
  <script>document.querySelectorAll('.chapters button').forEach(n=>n.onclick=()=>{document.querySelector('.chapters .active')?.classList.remove('active');n.classList.add('active')})</script>
</main></body></html>
