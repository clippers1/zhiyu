<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>方向 A · 循环路线图</title>
  <style>
    @font-face{font-family:ZhiyuSans;src:url('./assets/noto-sans-sc.woff2')}@font-face{font-family:ZhiyuSerif;src:url('./assets/noto-serif-sc.woff2');font-weight:700}
    /* Assumption: readers need the order first, not a pseudo-anatomical drawing. */
    *{box-sizing:border-box}body{margin:0;background:#e8ede5;color:#233d33;font-family:ZhiyuSans,sans-serif}button{font-family:ZhiyuSans,sans-serif}.phone{width:390px;min-height:844px;margin:auto;background:#f8faf5;padding:28px 20px}.eyebrow{font-size:12px;letter-spacing:.12em;color:#6d806e}.title{margin:7px 0 8px;font:700 30px/1.15 ZhiyuSerif,serif}.intro{margin:0;color:#52675d;font-size:14px;line-height:1.65}.map{position:relative;height:390px;margin:24px 0 16px;border-top:1px solid #d6dfd2;border-bottom:1px solid #d6dfd2}.map svg{position:absolute;inset:0;width:100%;height:100%}.node{position:absolute;width:88px;min-height:58px;padding:8px;border:1px solid #cad7c7;background:#fff;color:#29493b;border-radius:50%;font-size:13px;font-weight:650;line-height:1.25;box-shadow:0 5px 16px #29493b0d}.node small{display:block;margin-bottom:2px;color:#8a9989;font-size:10px}.node.active{outline:4px solid #f0c9bf;border-color:#b56f62}.body{left:2px;top:164px}.ra{left:72px;top:50px}.rv{left:70px;top:278px}.lungs{left:136px;top:4px}.la{right:66px;top:50px}.lv{right:64px;top:278px}.legend{position:absolute;left:105px;top:166px;width:144px;text-align:center}.legend b{display:block;font:700 22px ZhiyuSerif,serif}.legend span{font-size:11px;color:#768778}.step{padding:19px 18px;background:#fff;border:1px solid #d9e2d6}.step-head{display:flex;justify-content:space-between;color:#7b897c;font-size:11px;letter-spacing:.08em}.step h2{margin:8px 0 5px;font:700 21px/1.25 ZhiyuSerif,serif}.step p{margin:0;color:#52655c;font-size:14px;line-height:1.65}.controls{display:grid;grid-template-columns:44px 1fr 44px;gap:8px;margin-top:12px}.controls button{min-height:44px;border:1px solid #cbd7c8;background:#f7f9f5;color:#315143;font-size:13px;font-weight:600}.controls .play{background:#315d43;color:#fff;border-color:#315d43}.note{margin:12px 2px 0;color:#7a897b;font-size:11px;line-height:1.6}
  </style>
</head>
<body><main class="phone">
  <div class="eyebrow">方向 A · 循环路线图</div><h1 class="title">跟着血液走一圈</h1>
  <p class="intro">不假装画解剖图，只把六段循环关系画清楚。点任意一站即可了解。</p>
  <section class="map" aria-label="血液循环路线">
    <svg viewBox="0 0 350 390" aria-hidden="true">
      <path d="M46 193 C44 111 85 79 114 78 M114 78 C123 43 145 33 175 33 M175 33 C208 33 231 44 245 79" fill="none" stroke="#678da4" stroke-width="7" stroke-linecap="round"/>
      <path d="M113 106 C82 166 82 251 112 305" fill="none" stroke="#678da4" stroke-width="7" stroke-linecap="round"/>
      <path d="M245 105 C276 164 276 251 244 305 M244 305 C209 361 92 360 46 224" fill="none" stroke="#bc786c" stroke-width="7" stroke-linecap="round"/>
      <path d="M170 33 l-10 -7 m10 7 l-9 9 M111 305 l-10 -6 m10 6 l-2 -11 M244 305 l9 -8 m-9 8 l11 3" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round"/>
    </svg>
    <button class="node body active"><small>01</small>全身</button><button class="node ra"><small>02</small>右心房</button>
    <button class="node rv"><small>03</small>右心室</button><button class="node lungs"><small>04</small>肺</button>
    <button class="node la"><small>05</small>左心房</button><button class="node lv"><small>06</small>左心室</button>
    <div class="legend"><b>一条闭环</b><span>蓝色去肺 · 红色回全身</span></div>
  </section>
  <section class="step"><div class="step-head"><span>第 1 / 6 步</span><span>约 20 秒</span></div><h2>从全身回到右心房</h2><p>来自全身的血液经上、下腔静脉进入右心房。</p></section>
  <div class="controls"><button>‹</button><button class="play">逐步播放</button><button>›</button></div>
  <p class="note">示意关系经过简化；箭头和文字共同说明方向。</p>
  <script>document.querySelectorAll('.node').forEach((n,i)=>n.onclick=()=>{document.querySelector('.node.active')?.classList.remove('active');n.classList.add('active');document.querySelector('.step-head span').textContent=`第 ${i+1} / 6 步`})</script>
</main></body></html>
